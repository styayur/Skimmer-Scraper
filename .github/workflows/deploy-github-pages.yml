name: Deploy GitHub Pages Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit verified on main
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Build and publish GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::The dispatched main commit differs from the verified commit."
            exit 1
          fi
          conclusion=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$EXPECTED_SHA" -f per_page=1 \
            --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != success ]]; then
            echo "::error::The main CI run for the requested source commit must pass before deployment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
