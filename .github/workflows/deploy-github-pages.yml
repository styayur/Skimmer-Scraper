name: Deploy GitHub Pages Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit verified on main
        type: string
        required: true
      restore_latest:
        description: Restore the exact static ZIP of the latest stable GitHub Release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Build verified Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Verify requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::The dispatched main commit differs from the verified commit."
            exit 1
          fi
          conclusion=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$EXPECTED_SHA" -f per_page=1 \
            --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != success ]]; then
            echo "::error::The main CI run for the requested source commit must pass before deployment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        if: ${{ !inputs.restore_latest }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ !inputs.restore_latest }}
        run: npm ci

      - name: Build static site
        if: ${{ !inputs.restore_latest }}
        run: npm run build

      - name: Restore published stable site
        if: inputs.restore_latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/latest.json"
          tag=$(jq -er 'select(.isDraft == false and .isPrerelease == false) | .tagName' "$RUNNER_TEMP/latest.json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="skimmer-scraper-$tag-static.zip"
          digest=$(jq -er --arg file "$archive" '[.assets[] | select(.name == $file)] | select(length == 1) | .[0].digest' "$RUNNER_TEMP/latest.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$tag" --pattern "$archive" --dir "$RUNNER_TEMP"
          echo "${digest#sha256:}  $RUNNER_TEMP/$archive" | sha256sum --check
          git fetch --depth=1 --no-tags origin "refs/tags/$tag"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          mkdir dist
          unzip -q "$RUNNER_TEMP/$archive" -d dist
          test -s dist/index.html
          jq -e --arg sha "$commit" --arg version "${tag#v}" \
            '.sourceCommit == $sha and .version == $version and .dirty == false' dist/build-info.json
          echo "Restoring $tag at $commit from the published static ZIP ($digest)." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Name this build
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Publish verified Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify deployed artifact and revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$EXPECTED_SHA"
          for attempt in {1..12}; do
            if metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID") &&
               jq -e --arg name "$ARTIFACT_NAME" --arg sha "$EXPECTED_SHA" --arg run "$GITHUB_RUN_ID" \
                 '.name == $name and .expired == false and .workflow_run.head_sha == $sha and (.workflow_run.id|tostring) == $run' <<< "$metadata" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded artifact is unavailable for this run and source commit."
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
