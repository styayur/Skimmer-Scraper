name: Windows desktop

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source SHA to build
        required: true
        type: string
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/**'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify requested source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SHA) { throw 'Source SHA differs from expected_sha' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/build-info.json
          if-no-files-found: error
