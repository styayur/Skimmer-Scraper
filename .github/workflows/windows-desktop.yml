name: Windows desktop

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source SHA to build
        required: true
        type: string
      installer_lifecycle:
        description: Qualify this v0.11.0 SHA with four historical installers and rollback
        default: false
        type: boolean
      windows_build_run:
        description: Optional successful Windows desktop dispatch whose exact installer should be qualified
        type: string
        default: ''
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/platform/**'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  installer-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.installer_lifecycle
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/windows-lifecycle.yml
    with:
      candidate_sha: ${{ inputs.expected_sha }}
      windows_build_run: ${{ inputs.windows_build_run }}

  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.installer_lifecycle
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify requested source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SHA) { throw 'Source SHA differs from expected_sha' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install and verify the public high-fidelity archive in an isolated library
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml official_pack::tests::installs_public_archive_in_isolated_library -- --ignored --exact
      - run: npm run desktop:build -- --ci
      - name: Exercise the current-user installer and installed WebView2 client
        shell: pwsh
        run: |
          $bundle = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($bundle.Count -ne 1) { throw 'Expected one NSIS installer' }
          $install = Join-Path $env:RUNNER_TEMP 'SkimmerInstalled'
          $process = Start-Process -FilePath $bundle[0].FullName -ArgumentList '/S',"/D=$install" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "NSIS returned $($process.ExitCode)" }
          $client = Join-Path $install 'skimmer-scraper.exe'
          if (!(Test-Path -LiteralPath $client)) { throw 'Installed flight client is missing' }
          node scripts/desktop-smoke.mjs $client acceptance/installed-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed WebView2 smoke failed' }
          Get-FileHash -Algorithm SHA256 $bundle[0].FullName,$client |
            Select-Object @{Name='File';Expression={Split-Path $_.Path -Leaf}},Hash |
            ConvertTo-Json | Set-Content acceptance/installed-smoke/hashes.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/build-info.json
            acceptance/installed-smoke/
          if-no-files-found: error
