name: Windows installer lifecycle

on:
  pull_request:
    paths:
      - '.github/workflows/windows-lifecycle.yml'
      - 'scripts/windows-lifecycle/**'
      - 'src-tauri/src/desktop.rs'
      - 'src-tauri/src/library.rs'
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  candidate:
    if: inputs.candidate_sha != ''
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Check the candidate identity and installer scope
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -cne $env:EXPECTED_SHA -or
              $config.version -cne '0.11.0' -or $config.bundle.windows.nsis.installMode -cne 'currentUser' -or
              $config.identifier -cne 'io.github.styayur.skimmer-scraper') { throw 'Unexpected candidate or storage identity' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --ci
      - name: Record the build and installer hashes
        run: |
          $build = Get-Content dist/build-info.json -Raw | ConvertFrom-Json
          $bundle = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($bundle.Count -ne 1 -or $build.dirty -or $build.version -cne '0.11.0' -or
              $build.sourceCommit -cne (git rev-parse HEAD)) { throw 'Build provenance mismatch' }
          New-Item -ItemType Directory candidate-package
          Copy-Item -LiteralPath $bundle[0].FullName -Destination candidate-package
          @{
            source = $build.sourceCommit
            installer = $bundle[0].Name
            installerSha256 = (Get-FileHash $bundle[0].FullName).Hash.ToLowerInvariant()
            exeSha256 = (Get-FileHash src-tauri/target/release/skimmer-scraper.exe).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content candidate-package/identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-nsis-${{ inputs.candidate_sha }}
          path: candidate-package
          if-no-files-found: error

  lifecycle:
    needs: candidate
    if: ${{ !cancelled() && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        from: ['0.8.2', '0.9.1', '0.9.2', '0.10.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: inputs.candidate_sha != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-nsis-${{ inputs.candidate_sha }}
          path: candidate-package
      - name: Witness the registered installation and pilot through every relaunch
        env:
          START_VERSION: ${{ matrix.from }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ./scripts/windows-lifecycle/run.ps1 -From $env:START_VERSION -CandidateSha $env:CANDIDATE_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lifecycle-${{ inputs.candidate_sha || 'historical-0.10.0' }}-from-${{ matrix.from }}-${{ github.run_attempt }}
          path: acceptance/windows-lifecycle/
          if-no-files-found: error
