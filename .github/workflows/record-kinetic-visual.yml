name: Record Kinetic gameplay visual
on:
  push:
    branches: [codex/kinetic-city-evidence]
    paths:
      - .github/workflows/record-kinetic-visual.yml
      - scripts/capture-kinetic-demo.mjs
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 946d2f7e8381f9f9af68a0cf7e488ac41debde04
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the pinned integration candidate
        working-directory: candidate
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          cat dist/build-info.json
      - name: Record from the shipping spawn
        shell: bash
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          mkdir recordings
          npm --prefix candidate run preview -- --port 4175 --strictPort > "$RUNNER_TEMP/kinetic-preview.log" 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:4175/build-info.json >/dev/null; then break; fi; sleep 1; done
          node scripts/capture-kinetic-demo.mjs http://127.0.0.1:4175/ candidate recordings/seed-11
      - name: Upload gameplay and flight inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-free-flight-visual
          path: recordings/
          if-no-files-found: warn
      - name: Verify historical Dragon recovery and explicit span selection on the recorded build
        working-directory: candidate
        env:
          SKIMMER_TEST_PORT: 4177
        run: npx playwright test tests/e2e/dragon-realm.spec.ts --retries=0
